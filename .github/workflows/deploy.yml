name: Deploy to HostAfrica

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build server app
        run: bun run build

      - name: Zip the build output
        run: cd .output && zip -r ../fortstar-build.zip .

      - name: Upload build as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortstar-build
          path: fortstar-build.zip
          retention-days: 14
